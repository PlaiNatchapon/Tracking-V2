```html
<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>บันทึกคำสั่งซื้อ</title>

    <!-- โหลดไลบรารี Socket.io และตัวเช็กสิทธิ์ -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/sales.css" />
  </head>

  <body>
    <div class="sheet">
      <div class="letterhead">
        <div class="mark">
          <div class="mark-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 7l9-4 9 4-9 4-9-4z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M3 7v10l9 4 9-4V7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <div class="mark-text">
            <div class="eyebrow">Order Entry</div>
            <div class="doc-date" id="docDate">—</div>
          </div>
        </div>

        <button type="button" class="btn-logout" onclick="handleLogout()">
          ออกจากระบบ
        </button>
      </div>

      <div class="container">
        <h2>บันทึกข้อมูลสินค้า</h2>

        <!-- =========================
             เอกสารแนบ
        ========================== -->
        <div class="section-label">เอกสารแนบ</div>

        <div class="upload-row">
          <!-- ใบเสนอราคา: จำเป็น -->
          <div
            class="image-section"
            onclick="document.getElementById('fileQuo').click()"
          >
            <span class="dz-hint" id="labelQuo">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path
                  d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9l-6-6z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M14 3v6h6"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>

              <span>
                ใบเสนอราคา<br />
                <span class="req">จำเป็น</span>
              </span>
            </span>

            <img
              id="prevQuo"
              alt="ตัวอย่างใบเสนอราคา"
              style="display: none"
            />
          </div>

          <input
            type="file"
            id="fileQuo"
            hidden
            accept="image/*"
            onchange="previewImg(this, 'prevQuo', 'labelQuo')"
          />

          <!-- ใบส่งสินค้า: ไม่บังคับ -->
          <div
            class="image-section"
            onclick="document.getElementById('fileDel').click()"
          >
            <span class="dz-hint" id="labelDel">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path
                  d="M3 7h11v8H3z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M14 10h4l3 3v2h-7v-5z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <circle
                  cx="7"
                  cy="17"
                  r="1.6"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle
                  cx="17.5"
                  cy="17"
                  r="1.6"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
              </svg>

              <span>
                ใบส่งสินค้า<br />
                <span
                  style="
                    font-size: 10.5px;
                    color: var(--ink-faint);
                    font-family: var(--font-mono);
                  "
                >
                  ไม่บังคับ
                </span>
              </span>
            </span>

            <img
              id="prevDel"
              alt="ตัวอย่างใบส่งสินค้า"
              style="display: none"
            />
          </div>

          <input
            type="file"
            id="fileDel"
            hidden
            accept="image/*"
            onchange="previewImg(this, 'prevDel', 'labelDel')"
          />

          <!-- สลิปชำระเงิน: ไม่บังคับ
               ถ้าแนบสลิป Backend ต้องส่งออเดอร์ไปฝ่ายบัญชีโดยตรง -->
          <div
            class="image-section"
            onclick="document.getElementById('paymentSlip').click()"
          >
            <span class="dz-hint" id="labelSlip">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M3 10h18M7 15h4"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>

              <span>
                สลิปชำระเงิน<br />
                <span
                  style="
                    font-size: 10.5px;
                    color: var(--ink-faint);
                    font-family: var(--font-mono);
                  "
                >
                  ไม่บังคับ
                </span>
              </span>
            </span>

            <img
              id="prevSlip"
              alt="ตัวอย่างสลิปชำระเงิน"
              style="display: none"
            />
          </div>

          <input
            type="file"
            id="paymentSlip"
            name="payment_slip"
            hidden
            accept="image/*"
            onchange="previewImg(this, 'prevSlip', 'labelSlip')"
          />
        </div>

        <!-- =========================
             ผู้ทำรายการ
        ========================== -->
        <div class="section-label">ผู้ทำรายการ</div>

        <div class="form-row">
          <div class="form-group" style="width: 100%">
            <label for="employeeName">ชื่อ-นามสกุล</label>
            <input type="text" id="employeeName" readonly />
          </div>

          <div class="form-group" style="width: 100%">
            <label for="departmentName">แผนก</label>
            <input type="text" id="departmentName" readonly />
          </div>
        </div>

        <!-- =========================
             ข้อเสนอแนะ
        ========================== -->
        <div class="section-label">ข้อเสนอแนะเพิ่มเติม</div>

        <div class="form-row">
          <div class="form-group" style="width: 100%">
            <label for="additionalSuggestions">
              ความคิดเห็นหรือข้อเสนอแนะ
            </label>

            <input
              type="text"
              id="additionalSuggestions"
              placeholder="ระบุข้อเสนอแนะเพิ่มเติม (ถ้ามี)"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- =========================
             รายการสินค้า
        ========================== -->
        <div class="section-label">รายการสินค้า</div>

        <div id="product-list">
          <div class="product-item" style="position: relative">
            <div class="remove-row-btn" onclick="removeRow(this)">×</div>

            <div class="item-head">
              <span class="line-no">รายการ 01</span>
              <span class="stock-badge">พร้อมส่ง</span>
            </div>

            <div class="form-row">
              <div
                class="form-group col-30"
                style="position: relative"
              >
                <label>รหัสสินค้า</label>

                <input
                  type="text"
                  placeholder="รหัส..."
                  oninput="searchProduct(this, 'code')"
                  autocomplete="off"
                  class="p-code"
                />
              </div>

              <div
                class="form-group col-70"
                style="position: relative"
              >
                <label>ชื่อสินค้า</label>

                <input
                  type="text"
                  placeholder="ระบุชื่อสินค้า"
                  oninput="searchProduct(this, 'name')"
                  autocomplete="off"
                  class="p-name"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>ประเภท/ยี่ห้อ</label>

                <input
                  type="text"
                  placeholder="หมวดหมู่สินค้า"
                  readonly
                  class="p-category"
                />
              </div>

              <div class="form-group">
                <label>รายละเอียด</label>

                <input
                  type="text"
                  placeholder="สเปคเพิ่มเติม"
                  readonly
                  class="p-desc"
                />
              </div>
            </div>

            <div class="ledger-row">
              <div class="form-group">
                <label>ราคาทุน</label>

                <input
                  type="number"
                  placeholder="0.00"
                  readonly
                  class="p-cost"
                />
              </div>

              <div class="form-group">
                <label>ราคาขาย</label>

                <input
                  type="number"
                  placeholder="0.00"
                  readonly
                  class="p-sale"
                />
              </div>

              <div class="form-group qty">
                <label>คงเหลือ</label>

                <input
                  type="number"
                  value="0"
                  min="0"
                  readonly
                  class="p-stock"
                />
              </div>

              <div class="form-group buy-qty">
                <label>จำนวนที่เอา</label>

                <input
                  type="number"
                  min="1"
                  value="1"
                  oninput="checkStock(this)"
                  class="p-buy-qty"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- =========================
             ปุ่มดำเนินการ
        ========================== -->
        <div class="btn-group">
          <button
            type="button"
            class="btn btn-add"
            onclick="cloneRow()"
          >
            + เพิ่มรายการสินค้า
          </button>

          <button
            type="button"
            class="btn btn-save"
            id="saveOrderButton"
            onclick="saveOrder()"
          >
            บันทึกทั้งหมด
          </button>
        </div>
      </div>
    </div>

    <!-- JavaScript ของหน้าบันทึกคำสั่งซื้อ -->
    <script src="js/sales.js"></script>
  </body>
</html>
```
