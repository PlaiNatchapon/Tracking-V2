<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบ | System Authentication</title>
    <!-- Font Preconnect & Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- External CSS -->
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-sheet">
      <!-- Top Brand Header -->
      <div class="brand-header">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path
              d="M3 7l9-4 9 4-9 4-9-4z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M3 7v10l9 4 9-4V7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="brand-title">PRODUCT ACTIVITY TRACKER</div>
        <div class="brand-sub">ระบบติดตามสถานะสินค้า</div>
      </div>

      <!-- Main Receipt Card -->
      <div class="login-card">
        <h1 class="card-title">เข้าสู่ระบบ</h1>
        <p class="card-subtitle">กรุณาระบุข้อมูลบัญชีผู้ใช้เพื่อเข้าใช้งาน</p>

        <!-- Alert Notification Box -->
        <div class="alert-banner" id="alertBanner">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            style="flex-shrink: 0"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M12 8v4m0 4h.01"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span id="alertText">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <div class="section-label">Account Security</div>

        <!-- Form -->
        <form id="loginForm" autocomplete="off">
          <!-- Username Input -->
          <div class="form-group">
            <label for="username">ชื่อผู้ใช้งาน / Username</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="ระบุชื่อผู้ใช้งาน"
                required
              />
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                  <circle
                    cx="12"
                    cy="7"
                    r="4"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
              </span>
            </div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password">รหัสผ่าน / Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="11"
                    rx="2"
                    ry="2"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <path
                    d="M7 11V7a5 5 0 0 1 10 0v4"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
              </span>
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
                title="แสดง/ซ่อนรหัสผ่าน"
              >
                <svg
                  id="eyeIcon"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Options -->
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" />
              <span>จดจำการเข้าสู่ระบบ</span>
            </label>
            <a
              href="#"
              class="forgot-link"
              onclick="
                alert('กรุณาติดต่อผู้ดูแลระบบเพื่อทำการรีเซ็ตรหัสผ่าน');
                return false;
              "
              >ลืมรหัสผ่าน?</a
            >
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login" id="submitBtn">
            <span>เข้าสู่ระบบ</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 12h14m-6-6l6 6-6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>

        <div class="footer-text">Secured Portal &bull; v1.0.4</div>
      </div>
    </div>

    <!-- External Script -->
    <script src="js/login.js"></script>
  </body>
</html>
