<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบรับออเดอร์ - Modern Professional</title>
    <!-- โหลดไลบรารี Socket.io และตัวเช็กสิทธิ์ -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/order.css" />
  </head>
  <body>
    <div class="sheet">
      <div class="letterhead">
        <div class="mark">
          <div class="mark-icon">
            <svg
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              />
            </svg>
          </div>
          <div class="mark-text">
            <div class="eyebrow">Order Queue System</div>
          </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()">ออกจากระบบ</button>
      </div>

      <div class="container">
        <h2>รายการออเดอร์ขาเข้า</h2>
        <div class="section-label">Incoming Queue</div>

        <div id="order-list">
          <!-- ข้อมูลจากฐานข้อมูลจะถูกดึงมาแสดงผลแบบไดนามิกที่นี่ -->
        </div>
      </div>
    </div>
    <script src="js/order.js"></script>
  </body>
</html>
