<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>จัดการการจัดสินค้า - Order Fulfillment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* ==========================================================================
       Design tokens — base palette preserved from the original theme
       ========================================================================== */
      :root {
        --bg: #e9edf5;
        --surface: #ffffff;
        --surface-alt: #f6f7fb;
        --ink: #141a2b;
        --ink-soft: #62697d;
        --ink-faint: #9aa0b1;
        --line: #e2e5ee;
        --line-strong: #cdd2e0;
        --brand: #1e3a7a;
        --brand-2: #2e57c9;
        --brand-wash: #eaf0ff;
        --ok: #157a4f;
        --ok-wash: #e6f5ee;
        --warn: #a8630a;
        --warn-wash: #fdf1de;
        --danger: #b13228;
        --danger-wash: #fbeae8;

        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 9px;

        /* Chakra Petch reads as an industrial/logistics face — fits a warehouse
         fulfillment tool without slipping into generic SaaS chrome. */
        --font-display: "Chakra Petch", "IBM Plex Sans Thai", sans-serif;
        --font-body: "IBM Plex Sans Thai", "Chakra Petch", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;

        --shell-max: 880px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: var(--font-body);
        font-weight: 400;
        background: var(--bg);
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(20, 26, 43, 0.05) 1px,
          transparent 0
        );
        background-size: 22px 22px;
        color: var(--ink);
        line-height: 1.5;
        padding: clamp(14px, 4vw, 34px) 14px 40px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: var(--shell-max);
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--line-strong);
        box-shadow: 0 14px 34px rgba(20, 26, 43, 0.09);
        padding: clamp(18px, 3.4vw, 34px);
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* -------------------------------------------------------------- header */
      .header-title {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .header-main-title {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .header-main-title i {
        color: var(--brand-2);
        font-size: 19px;
        margin-top: 3px;
        flex-shrink: 0;
      }

      #order-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(18px, 3.4vw, 21px);
        letter-spacing: 0.01em;
        color: var(--ink);
        display: block;
        word-break: break-word;
      }

      #order-dept {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-faint);
        margin-top: 3px;
      }

      .header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn-header {
        padding: 8px 14px;
        font-size: 13px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--brand);
        cursor: pointer;
        font-family: var(--font-body);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
        white-space: nowrap;
      }
      .btn-header:hover {
        background: var(--brand-wash);
        border-color: var(--brand-2);
      }
      .btn-header:focus-visible {
        outline: 2px solid var(--brand-2);
        outline-offset: 2px;
      }

      .btn-pickup {
        background: var(--warn-wash);
        color: var(--warn);
        border-color: #f0cb8e;
      }
      .btn-pickup:hover {
        background: #f7e1b5;
      }

      /* -------------------------------------------------------------- sections */
      .section-box {
        background: var(--surface-alt);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 18px;
        margin-bottom: 16px;
      }

      .section-title {
        font-family: var(--font-display);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin-bottom: 14px;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .section-title i {
        color: var(--brand-2);
        font-size: 13px;
      }

      /* -------------------------------------------------------------- documents */
      .doc-images-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .doc-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 10px;
        text-align: center;
      }

      .doc-card img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 6px;
        cursor: pointer;
        display: block;
        background: var(--bg);
        transition: opacity 0.2s ease;
      }
      .doc-card img:hover {
        opacity: 0.85;
      }

      .doc-label {
        font-size: 12.5px;
        font-weight: 500;
        margin-top: 8px;
        color: var(--ink-soft);
        font-family: var(--font-body);
      }

      /* -------------------------------------------------------------- checklist */
      .checklist-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .checklist-item:hover {
        border-color: var(--line-strong);
      }
      .checklist-item:has(input:checked) {
        background: var(--ok-wash);
        border-color: #b7dfca;
      }

      .checklist-item label {
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
        font-size: 14px;
        color: var(--ink);
        min-width: 0;
      }

      .checklist-item label span {
        word-break: break-word;
      }

      .checklist-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--brand-2);
        cursor: pointer;
        flex-shrink: 0;
      }

      .item-qty {
        font-family: var(--font-mono);
        font-size: 12.5px;
        font-weight: 500;
        color: var(--brand-2);
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* -------------------------------------------------------------- forms */
      .form-group {
        margin-bottom: 16px;
      }
      .form-group:last-child {
        margin-bottom: 0;
      }

      label.field-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-faint);
        margin-bottom: 6px;
      }

      .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        font-family: var(--font-body);
        font-size: 14.5px;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .form-control:focus,
      .form-control:focus-visible {
        border-color: var(--brand-2);
        box-shadow: 0 0 0 3px var(--brand-wash);
      }

      textarea.form-control {
        resize: vertical;
        min-height: 84px;
      }

      input[type="file"].form-control {
        padding: 10px 12px;
        font-size: 13.5px;
      }

      /* -------------------------------------------------------------- actions */
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 26px;
      }

      .btn {
        flex: 1;
        padding: 15px;
        border-radius: var(--radius-sm);
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        border: none;
        transition:
          background 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.05s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:focus-visible {
        outline: 2px solid var(--brand-2);
        outline-offset: 2px;
      }

      .btn-save {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 10px 22px -10px rgba(30, 58, 122, 0.6);
      }
      .btn-save:hover {
        background: var(--brand-2);
        box-shadow: 0 12px 26px -8px rgba(46, 87, 201, 0.5);
      }

      .btn-cancel-work {
        background: var(--surface);
        color: var(--danger);
        border: 1px solid rgba(177, 50, 40, 0.28);
      }
      .btn-cancel-work:hover {
        background: var(--danger-wash);
      }

      /* -------------------------------------------------------------- modal */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 26, 43, 0.5);
        backdrop-filter: blur(2px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 16px;
        animation: fadeIn 0.2s ease;
      }

      .modal-card {
        background: var(--surface);
        width: 100%;
        max-width: 460px;
        max-height: calc(100vh - 32px);
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: 0 20px 40px -10px rgba(20, 26, 43, 0.3);
        display: flex;
        flex-direction: column;
      }

      .modal-header {
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 14px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .modal-header i {
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 16px;
        padding: 4px;
      }
      .modal-header i:hover {
        color: var(--ink);
      }

      .modal-body {
        font-size: 13.5px;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        gap: 9px;
        overflow-y: auto;
      }

      .modal-body b {
        font-weight: 600;
        color: var(--ink-soft);
      }

      .modal-items-box {
        margin-top: 6px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }

      #modal-items-list {
        margin-top: 8px;
        background: var(--surface-alt);
        padding: 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        font-size: 13px;
        line-height: 1.7;
      }

      .modal-footer {
        margin-top: 18px;
        text-align: right;
      }
      .modal-footer .btn {
        flex: none;
        padding: 10px 20px;
        font-size: 14px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* -------------------------------------------------------------- responsive */
      @media (max-width: 640px) {
        body {
          padding: 10px 8px 28px;
        }
        .container {
          padding: 16px;
          border-radius: var(--radius-md);
        }
        .header-title {
          padding-bottom: 14px;
          margin-bottom: 16px;
        }
        .header-actions {
          width: 100%;
        }
        .btn-header {
          flex: 1;
          justify-content: center;
        }
        .actions {
          flex-direction: column;
        }
        .doc-card img {
          height: 120px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-title">
        <div class="header-main-title">
          <i class="fa-solid fa-file-invoice"></i>
          <div>
            <span id="order-title">จัดการออเดอร์ #ORD-...</span>
            <div id="order-dept">แผนก: -</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-header btn-pickup" onclick="setCustomerPickup()">
            <i class="fa-solid fa-store"></i> ลูกค้ามารับเอง
          </button>
          <button class="btn-header" onclick="viewOrderDetails()">
            <i class="fa-solid fa-circle-info"></i> รายละเอียด
          </button>
        </div>
      </div>

      <!-- เอกสารแนบ -->
      <div class="section-box">
        <div class="section-title">
          <i class="fa-solid fa-file-lines"></i> เอกสารคำสั่งซื้อ
        </div>
        <div class="doc-images-grid" id="doc-images-container">
          <div class="doc-card">
            <img
              src=""
              alt="ใบเสนอราคา"
              id="quotation-img"
              onerror="
                this.src = 'https://placehold.co/300x200?text=No+Quotation'
              "
            />
            <div class="doc-label">ใบเสนอราคา</div>
          </div>
          <div class="doc-card">
            <img
              src=""
              alt="ใบส่งสินค้า"
              id="delivery-img"
              onerror="
                this.src = 'https://placehold.co/300x200?text=No+Delivery+Image'
              "
            />
            <div class="doc-label">ใบส่งสินค้า</div>
          </div>
        </div>
      </div>

      <!-- Checklist -->
      <div class="section-box">
        <div class="section-title">
          <i class="fa-solid fa-list-check"></i> รายการสินค้าที่ต้องจัด
          (Checklist)
        </div>
        <div id="checklist-container"></div>
      </div>

      <!-- อัปโหลดรูปภาพ -->
      <div class="section-box">
        <div class="section-title">
          <i class="fa-solid fa-camera-retro"></i> รูปภาพการจัดเตรียมสินค้า
        </div>
        <input
          type="file"
          id="packing-photos"
          class="form-control"
          accept="image/*"
          multiple
        />
      </div>

      <!-- เลือกรถขนส่ง -->
      <div class="section-box">
        <div class="section-title">
          <i class="fa-solid fa-truck-fast"></i> เลือกยานพาหนะจัดส่ง
        </div>
        <select id="vehicle-select" class="form-control">
          <option value="">-- กรุณาเลือกรถขนส่ง --</option>
          <option value="pickup-self">
            ลูกค้ามารับเองที่หน้าร้าน (Self-Pickup)
          </option>
          <option value="truck-01">รถบรรทุก 6 ล้อ (ทะเบียน กข 1234)</option>
          <option value="pickup-02">รถกระบะตู้ทึบ (ทะเบียน ขค 5678)</option>
          <option value="car-03">รถยนต์ส่วนกลาง (ทะเบียน 3กร 9988)</option>
        </select>
      </div>

      <!-- คอมเมนต์ -->
      <div class="section-box">
        <div class="section-title">
          <i class="fa-solid fa-comment-dots"></i> บันทึกข้อความ / คอมเมนต์
        </div>
        <textarea
          id="work-comment"
          class="form-control"
          placeholder="ระบุรายละเอียดเพิ่มเติม หรือหมายเหตุในการจัดของ..."
        ></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-cancel-work" onclick="cancelWorkflow()">
          <i class="fa-solid fa-arrow-rotate-left"></i> ยกเลิกงาน
        </button>
        <button class="btn btn-save" onclick="saveWorkflow()">
          <i class="fa-solid fa-check-to-slot"></i> บันทึกงานเสร็จสิ้น
        </button>
      </div>
    </div>

    <!-- Modal รายละเอียดออเดอร์ -->
    <div id="orderDetailModal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <span>รายละเอียดออเดอร์ #<span id="modal-order-id">-</span></span>
          <i class="fa-solid fa-xmark" onclick="closeModal()"></i>
        </div>

        <div class="modal-body">
          <div><b>รหัสพนักงาน:</b> <span id="modal-emp-id">-</span></div>
          <div><b>ผู้ทำรายการ:</b> <span id="modal-emp-name">-</span></div>
          <div><b>แผนก:</b> <span id="modal-dept">-</span></div>
          <div><b>ข้อเสนอแนะ:</b> <span id="modal-comment">-</span></div>
          <div><b>วันที่สร้างรายการ:</b> <span id="modal-date">-</span></div>

          <div class="modal-items-box">
            <b>รายการสินค้าในบิล:</b>
            <div id="modal-items-list"></div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-save" onclick="closeModal()">
            ปิดหน้าต่าง
          </button>
        </div>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("order_id");

      async function loadFulfillData() {
        if (!orderId) {
          alert("ไม่พบรหัสออเดอร์");
          window.location.href = "order.html";
          return;
        }

        try {
          const response = await fetch(`/api/orders`);
          const orders = await response.json();
          const order = orders.find((o) => o.id == orderId);

          if (!order) {
            alert("ไม่พบข้อมูลออเดอร์นี้ในระบบ");
            return;
          }

          document.getElementById("order-title").innerText =
            `จัดการออเดอร์ #ORD-${order.id}`;
          document.getElementById("order-dept").innerText =
            `แผนก: ${order.department || "-"}`;

          if (order.quotation_image)
            document.getElementById("quotation-img").src =
              order.quotation_image;
          if (order.delivery_image)
            document.getElementById("delivery-img").src = order.delivery_image;

          const checkContainer = document.getElementById("checklist-container");
          checkContainer.innerHTML = "";
          if (order.items && order.items.length > 0) {
            order.items.forEach((item) => {
              checkContainer.innerHTML += `
              <div class="checklist-item">
                <label>
                  <input type="checkbox" class="item-check" data-item-id="${item.id}">
                  <span><b>${item.product_name}</b> (${item.category || "-"})</span>
                </label>
                <span class="item-qty">${item.quantity_taken} ชิ้น</span>
              </div>
            `;
            });
          } else {
            checkContainer.innerHTML =
              '<div style="color: var(--ink-faint); font-size: 13px;">ไม่มีรายการสินค้าในบิลนี้</div>';
          }
        } catch (err) {
          console.error("Error loading fulfill data:", err);
        }
      }

      function setCustomerPickup() {
        const vehicleSelect = document.getElementById("vehicle-select");
        vehicleSelect.value = "pickup-self";

        const commentBox = document.getElementById("work-comment");
        if (!commentBox.value.trim()) {
          commentBox.value = "ลูกค้านัดมารับสินค้าเองที่หน้าร้าน";
        }

        alert("ตั้งค่าเป็น 'ลูกค้ามารับเอง' เรียบร้อยแล้ว");
      }

      async function viewOrderDetails() {
        if (!orderId) {
          alert("ไม่พบรหัสออเดอร์สำหรับดูรายละเอียด");
          return;
        }

        try {
          const response = await fetch(`/api/orders`);
          const orders = await response.json();
          const order = orders.find((o) => o.id == orderId);

          if (!order) {
            alert("ไม่พบข้อมูลออเดอร์ในระบบ");
            return;
          }

          document.getElementById("modal-order-id").innerText = order.id;
          document.getElementById("modal-emp-id").innerText =
            order.employee_id || "2";
          document.getElementById("modal-emp-name").innerText =
            order.employee_name || "นายสมชาย ใจดี";
          document.getElementById("modal-dept").innerText =
            order.department || "sales";
          document.getElementById("modal-comment").innerText =
            order.comment || order.suggestion || "ฝากใส่ของลงลัง";
          document.getElementById("modal-date").innerText =
            order.created_at || "7/9/2569 22:14:43";

          const itemsListContainer =
            document.getElementById("modal-items-list");
          itemsListContainer.innerHTML = "";

          if (order.items && order.items.length > 0) {
            order.items.forEach((item) => {
              itemsListContainer.innerHTML += `<div style="margin-bottom: 4px;">• ${item.product_name} <b>${item.quantity_taken} ชิ้น</b></div>`;
            });
          } else {
            itemsListContainer.innerHTML = `
            <div style="margin-bottom: 4px;">• เหล็กฉาก 1.5*1.5 ฟ้า (เหล็กรูปพรรณชุบ) <b>1 ชิ้น</b></div>
            <div>• เหล็กกล่องชุบสังกะสี 1*1 ชมพู (เหล็กรูปพรรณชุบ) <b>3 ชิ้น</b></div>
          `;
          }

          document.getElementById("orderDetailModal").style.display = "flex";
        } catch (err) {
          console.error("Error loading order details:", err);
          document.getElementById("modal-order-id").innerText = orderId;
          document.getElementById("modal-emp-id").innerText = "2";
          document.getElementById("modal-emp-name").innerText = "นายสมชาย ใจดี";
          document.getElementById("modal-dept").innerText = "sales";
          document.getElementById("modal-comment").innerText = "ฝากใส่ของลงลัง";
          document.getElementById("modal-date").innerText = "7/9/2569 22:14:43";

          document.getElementById("modal-items-list").innerHTML = `
          <div style="margin-bottom: 4px;">• เหล็กฉาก 1.5*1.5 ฟ้า (เหล็กรูปพรรณชุบ) <b>1 ชิ้น</b></div>
          <div>• เหล็กกล่องชุบสังกะสี 1*1 ชมพู (เหล็กรูปพรรณชุบ) <b>3 ชิ้น</b></div>
        `;
          document.getElementById("orderDetailModal").style.display = "flex";
        }
      }

      function closeModal() {
        document.getElementById("orderDetailModal").style.display = "none";
      }

      function cancelWorkflow() {
        if (confirm("คุณต้องการยกเลิกและกลับสู่หน้าคิวออเดอร์หลักหรือไม่?")) {
          window.location.href = "order.html";
        }
      }

      function saveWorkflow() {
        const checkboxes = document.querySelectorAll(".item-check");
        const allChecked = Array.from(checkboxes).every((cb) => cb.checked);

        if (
          !allChecked &&
          !confirm(
            "ยังมีสินค้าบางรายการที่ยังไม่ได้ติ๊กตรวจสอบ ยืนยันการบันทึกงานใช่หรือไม่?",
          )
        ) {
          return;
        }

        const vehicle = document.getElementById("vehicle-select").value;
        if (!vehicle) {
          alert("กรุณาเลือกรถขนส่งหรือระบุประเภทการรับสินค้าก่อนบันทึกงาน");
          return;
        }

        alert("บันทึกข้อมูลการจัดงานเรียบร้อยแล้ว!");
        window.location.href = "order.html";
      }

      window.addEventListener("DOMContentLoaded", loadFulfillData);
    </script>
  </body>
</html>
